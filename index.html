<style>
    :root {
        --paper: #f8fafc;
        --ink: #1e293b;
        --sub: #64748b;
        --line: #d8e2ef;
        --blue: #2563eb;
        --blue-soft: #dbeafe;
        --red: #dc2626;
        --red-soft: #fee2e2;
        --card: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        color: var(--ink);
        font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
        background:
            radial-gradient(circle at 85% 10%, #fee2e2 0%, transparent 35%),
            radial-gradient(circle at 10% 85%, #dbeafe 0%, transparent 32%),
            var(--paper);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header {
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(255,255,255,0.85);
        backdrop-filter: blur(6px);
        position: sticky;
        top: 0;
    }

    .head-inner {
        max-width: 980px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
    }

    .head-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 900;
    }

    .head-links {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .head-links a {
        color: var(--ink);
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.8rem;
        background: #fff;
    }

    main {
        width: 100%;
        max-width: 980px;
        margin: 0 auto;
        padding: 30px 20px 40px;
        flex: 1;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 18px;
        align-items: stretch;
    }

    .hero,
    .panel {
        background: var(--card);
        border: 1px solid #e7edf6;
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 10px 24px rgba(30, 41, 59, 0.06);
    }

    .kicker {
        margin: 0;
        color: var(--sub);
        font-size: 0.76rem;
        letter-spacing: 0.08em;
        font-weight: 700;
    }

    h1 {
        margin: 8px 0 10px;
        font-family: "Shippori Mincho", serif;
        font-size: clamp(1.45rem, 2.5vw, 2rem);
        line-height: 1.35;
    }

    .hero p {
        margin: 0;
        color: #334155;
        line-height: 1.7;
        font-size: 0.93rem;
    }

    .features {
        margin-top: 16px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
    }

    .feature {
        border: 1px solid #e9eff8;
        background: #fbfdff;
        border-radius: 10px;
        padding: 10px;
        font-size: 0.8rem;
        color: #475569;
    }

    .panel h2 {
        margin: 0 0 10px;
        font-size: 1.02rem;
    }

    .status-box {
        border: 1px dashed #c7d7eb;
        background: #f8fbff;
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 0.82rem;
        color: #334155;
        margin-bottom: 12px;
    }

    .status-box strong {
        color: #0f172a;
    }

    .actions {
        display: grid;
        gap: 10px;
    }

    .btn {
        border: none;
        border-radius: 12px;
        padding: 13px 14px;
        font-weight: 800;
        cursor: pointer;
        text-align: left;
        font-size: 0.92rem;
    }

    .btn small {
        display: block;
        margin-top: 3px;
        opacity: 0.85;
        font-size: 0.73rem;
        font-weight: 500;
    }

    .btn-primary {
        color: #fff;
        background: linear-gradient(120deg, #1d4ed8 0%, #2563eb 60%, #3b82f6 100%);
    }

    .btn-resume {
        color: #1d4ed8;
        background: var(--blue-soft);
        border: 1px solid #bfdbfe;
    }

    .btn-result {
        color: #991b1b;
        background: var(--red-soft);
        border: 1px solid #fecaca;
    }

    .btn-sub {
        color: #334155;
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
    }

    .muted {
        margin-top: 10px;
        color: var(--sub);
        font-size: 0.74rem;
        line-height: 1.5;
    }

    footer {
        margin-top: auto;
        padding: 24px 16px 30px;
        text-align: center;
        color: var(--sub);
        font-size: 0.76rem;
    }

    footer a {
        color: #2563eb;
        text-decoration: none;
    }

    @media (max-width: 860px) {
        main {
            grid-template-columns: 1fr;
        }

        .features {
            grid-template-columns: 1fr;
        }
    }
</style>

<body>
<header>
    <div class="head-inner">
        <p class="head-title">お笑い16タイプ診断(お笑いMBTI)</p>
        <nav class="head-links">
            <a href="/owarai/analytics/">分布分析</a>
            <a href="/owarai/privacy.html">プライバシーポリシー</a>
        </nav>
    </div>
</header>

<main>
    <section class="hero">
        <p class="kicker">WELCOME</p>
        <h1>あなたの笑いは、<br>16タイプのどこにいる？</h1>
        <p>
            16問の質問から、笑いのスタイルを4軸で分析。
            「理/乱」「和/毒」「静/動」「衆/深」の組み合わせで、あなたのユーモアタイプを診断します。
        </p>
        <div class="features">
            <div class="feature">質問数: 16問</div>
            <div class="feature">所要時間: 約2-3分</div>
            <div class="feature">前回データ: 自動保存対応</div>
        </div>
    </section>

    <section class="panel">
        <h2>はじめる</h2>
        <div class="status-box" id="save-status">保存データを確認中...</div>

        <div class="actions">
            <button class="btn btn-primary" id="btn-start">新しく診断をはじめる
                <small>保存データをリセットしてQ1から開始</small>
            </button>
            <button class="btn btn-resume" id="btn-resume" style="display:none;">途中から再開する
                <small id="resume-detail">前回の続きから再開</small>
            </button>
            <button class="btn btn-result" id="btn-result" style="display:none;">前回の結果を見る
                <small>診断済みの結果画面を表示</small>
            </button>
            <button class="btn btn-sub" id="btn-analytics" type="button">タイプ分布分析を開く
                <small>3/28時点 2,484件の分布と軸傾向</small>
            </button>
        </div>

        <p class="muted">診断状態はこの端末のブラウザにのみ保存されます。サーバーには保存されません。</p>
    </section>
</main>

<footer>
    <p>
        <a href="https://dim7.jp">運営者情報 (dim7.jp)</a>
    </p>
    <p>&copy; 2026 1984dim7 dim7.jp</p>
</footer>

<script>
    const STORAGE_KEY = "owarai_diagnosis_v1";
    const QUIZ_URL = "/owarai/quiz.html";

    function loadState() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;

        try {
            const parsed = JSON.parse(raw);
            if (!parsed || parsed.version !== 1) return null;
            return parsed;
        } catch (_e) {
            return null;
        }
    }

    function formatDate(ts) {
        if (!ts) return "不明";
        const d = new Date(ts);
        const yy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        const hh = String(d.getHours()).padStart(2, "0");
        const mi = String(d.getMinutes()).padStart(2, "0");
        return `${yy}/${mm}/${dd} ${hh}:${mi}`;
    }

    function jumpToQuiz() {
        window.location.href = QUIZ_URL;
    }

    function init() {
        const statusEl = document.getElementById("save-status");
        const resumeBtn = document.getElementById("btn-resume");
        const resultBtn = document.getElementById("btn-result");
        const resumeDetail = document.getElementById("resume-detail");

        const saved = loadState();

        if (!saved) {
            statusEl.innerHTML = "<strong>保存データなし</strong><br>新規診断を開始できます。";
        } else if (saved.status === "completed" && saved.myResultData && saved.myResultData.typeKey) {
            statusEl.innerHTML = `<strong>前回の結果が保存されています</strong><br>タイプ: ${saved.myResultData.typeKey} / 更新: ${formatDate(saved.updatedAt)}`;
            resultBtn.style.display = "block";
        } else {
            const qNum = Number.isInteger(saved.currentIdx) ? saved.currentIdx + 1 : 1;
            statusEl.innerHTML = `<strong>途中データが保存されています</strong><br>Q${qNum} から再開できます（更新: ${formatDate(saved.updatedAt)}）`;
            resumeBtn.style.display = "block";
            resumeDetail.textContent = `前回は Q${qNum} まで回答済み`;
        }

        document.getElementById("btn-start").addEventListener("click", () => {
            localStorage.removeItem(STORAGE_KEY);
            jumpToQuiz();
        });

        resumeBtn.addEventListener("click", jumpToQuiz);
        resultBtn.addEventListener("click", jumpToQuiz);

        document.getElementById("btn-analytics").addEventListener("click", () => {
            window.location.href = "/owarai/analytics/";
        });
    }

    init();
</script>
</body>
</html>
